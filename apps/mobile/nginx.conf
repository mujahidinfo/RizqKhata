# Rizq Khata app — web build (Expo single-page export) served by nginx.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # expo-sqlite runs SQLite as WebAssembly with SharedArrayBuffer, which needs
    # a cross-origin-isolated page. These two headers must be on every response.
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Hashed bundles and assets never change: cache them for a year.
    location ~* ^/(_expo|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Every route is handled by the app (Expo Router), so unknown paths get the
    # shell. index.html itself must never be cached, or users keep old bundles.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
